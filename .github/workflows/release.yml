# Desktop release (ADR 0007, amended 2026-09-03 for Windows + Linux): tag `v*`
# → build every platform, require Mac signing/notarization, publish one draft
# GitHub Release with the installers and the latest*.yml files electron-updater
# reads. macOS is the tested platform (packaged smoke test); Windows and Linux
# are build-only until their e2e runs are green. `workflow_dispatch` builds
# unsigned and uploads artifacts without publishing.
#
# Shape, and why:
# - `prepare` runs once: it refuses a tag that does not match electron/package.json
#   (electron-builder names the release from the package version, not the tag, so
#   a mismatch would silently create a second draft) and creates the draft release
#   up front, so the three platform jobs attach to it instead of racing to create it.
# - macOS is ONE job building `--arm64 --x64` together: electron-builder writes a
#   single latest-mac.yml listing both architectures. Two jobs would each upload
#   their own latest-mac.yml and the second would overwrite the first, leaving the
#   updater blind to one architecture.
name: Release (desktop)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-media:
    uses: ./.github/workflows/native-media.yml

  prepare:
    name: Check version, create draft
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release policy before creating a draft
        id: mode
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node electron/scripts/release-policy.mjs
      - name: Wait for CI on this commit to be green
        if: steps.mode.outputs.publish == 'always'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag can be pushed the moment its commit lands, before CI has run on it.
          # Wait for the CI workflow on this exact commit; refuse to release on red.
          for i in $(seq 1 60); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
                     --json status,conclusion,url --limit 10)
            if echo "$runs" | jq -e 'map(select(.conclusion == "success")) | length > 0' >/dev/null; then
              echo "CI is green on $GITHUB_SHA"; exit 0
            fi
            if echo "$runs" | jq -e 'map(select(.status == "completed" and .conclusion != "success" and .conclusion != "cancelled")) | length > 0' >/dev/null; then
              echo "::error::CI failed on $GITHUB_SHA — fix main, then re-tag."
              echo "$runs" | jq -r '.[] | "\(.status) \(.conclusion // "-") \(.url)"'
              exit 1
            fi
            if [[ "$runs" == "[]" && $i -gt 6 ]]; then
              echo "::error::No CI run found for $GITHUB_SHA after 3 minutes. Tag a commit on main that CI has seen."
              exit 1
            fi
            echo "CI not finished yet (attempt $i/60), waiting 30s…"; sleep 30
          done
          echo "::error::CI did not finish within 30 minutes."; exit 1
      - name: Create the draft release once
        if: steps.mode.outputs.publish == 'always'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder reuses an existing draft whose tag_name matches the version tag.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; attaching to it."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "${{ steps.mode.outputs.version }}" --notes ""
          fi

  mac:
    name: macOS arm64 + x64
    needs: [prepare, native-media]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - name: Build web app + main process
        run: npm run build:all
        working-directory: electron
      - name: Use unsigned builds only for manual dispatch
        if: needs.prepare.outputs.publish == 'never'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: Configure required release notarization
        if: needs.prepare.outputs.publish == 'always'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Import the Developer ID certificate into a build keychain
        if: needs.prepare.outputs.publish == 'always'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
          keychain: crux-signing
          keychain-password: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Point electron-builder at that keychain
        if: needs.prepare.outputs.publish == 'always'
        run: |
          KC=$(ls "$HOME"/Library/Keychains/crux-signing.keychain* | head -1)
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-darwin-*
          path: native-media-artifacts
          merge-multiple: true
      - name: Restore native binary modes and sources
        shell: bash
        run: |
          mkdir -p electron/.native-tools
          for archive in native-media-artifacts/*.tar.gz; do
            tar -xzf "$archive" -C electron/.native-tools
          done
      - name: Package (both architectures → one latest-mac.yml)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg zip --arm64 --x64 --config.forceCodeSigning=${{ needs.prepare.outputs.publish == 'always' }} --publish "${{ needs.prepare.outputs.publish }}"
      - name: Smoke-test the packaged app (runner's native arch)
        working-directory: electron
        env:
          CRUX_PACKAGED: '1'
        run: |
          npx playwright install chromium
          npx playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-mac
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.yml
            electron/e2e/.results/packaged-gateway.png
          if-no-files-found: error

  linux:
    name: Linux x64 (AppImage + deb)
    needs: [prepare, native-media]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-x64
          path: native-media-artifacts
          merge-multiple: true
      - name: Restore native binary modes and sources
        shell: bash
        run: |
          mkdir -p electron/.native-tools
          for archive in native-media-artifacts/*.tar.gz; do
            tar -xzf "$archive" -C electron/.native-tools
          done
      - name: Package
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish "${{ needs.prepare.outputs.publish }}"
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.yml
          if-no-files-found: error

  windows:
    name: Windows x64 (NSIS)
    needs: [prepare, native-media]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - name: Signing env (only when a certificate is configured)
        # Windows code signing (optional): a .pfx as base64 + password. Absent → unsigned
        # (SmartScreen warns until reputation builds). SignPath / Azure Trusted Signing
        # can replace this step later without touching the rest of the workflow.
        # An empty CSC_LINK is read as a path and fails the build, so export only when set.
        shell: bash
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [[ -n "$WIN_CERT_PFX" ]]; then
            echo "CSC_LINK=$WIN_CERT_PFX" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Windows certificate present: signing"
          else
            echo "No Windows certificate secret: unsigned build"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: native-win32-x64
          path: native-media-artifacts
          merge-multiple: true
      - name: Restore native binary modes and sources
        shell: bash
        run: |
          mkdir -p electron/.native-tools
          for archive in native-media-artifacts/*.tar.gz; do
            tar -xzf "$archive" -C electron/.native-tools
          done
      - name: Package
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish "${{ needs.prepare.outputs.publish }}"
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-win-x64
          path: |
            electron/release/*.exe
            electron/release/*.yml
          if-no-files-found: error
