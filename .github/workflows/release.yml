# Desktop release (ADR 0007, amended 2026-09-03 for Windows + Linux): tag `v*`
# → build every platform, sign/notarize where secrets exist, publish one draft
# GitHub Release with the installers and the latest*.yml files electron-updater
# reads. macOS is the tested platform (packaged smoke test); Windows and Linux
# are build-only until their e2e runs are green. `workflow_dispatch` builds
# unsigned and uploads artifacts without publishing.
name: Release (desktop)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - name: Build web app + main process
        run: npm run build:all
        working-directory: electron
      - name: Package
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID certificate (.p12, base64) + password — absent → unsigned build
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}
          # Notarization (electron-builder `notarize: true`) — absent → skipped
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PUBLISH=never
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then PUBLISH=always; fi
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish "$PUBLISH"
      - name: Smoke-test the packaged app
        if: matrix.arch == 'arm64'
        working-directory: electron
        env:
          CRUX_PACKAGED: '1'
        run: |
          npx playwright install chromium
          npx playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-mac-${{ matrix.arch }}
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.yml
            electron/e2e/.results/packaged-gateway.png
          if-no-files-found: error

  linux:
    name: Linux x64 (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - name: Package
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH=never
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then PUBLISH=always; fi
          npx electron-builder --linux --x64 --publish "$PUBLISH"
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.yml
          if-no-files-found: error

  windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - name: Package
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (optional): a .pfx as base64 + password. Absent → unsigned
          # (SmartScreen warns until reputation builds). SignPath / Azure Trusted Signing
          # can replace this step later without touching the rest of the workflow.
          CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          PUBLISH=never
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then PUBLISH=always; fi
          npx electron-builder --win --x64 --publish "$PUBLISH"
      - uses: actions/upload-artifact@v4
        with:
          name: crux-garden-win-x64
          path: |
            electron/release/*.exe
            electron/release/*.yml
          if-no-files-found: error
