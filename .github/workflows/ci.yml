name: CI

on:
  pull_request:
  push:
    branches: [main, v1-launch]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (web + electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm run verify           # tsc + eslint + vitest + vite build — the same gate the agent runs
      - run: npm ci
        working-directory: electron
      - run: npm run verify
        working-directory: electron

  e2e:
    name: e2e (real desktop app, macOS)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - run: npx playwright install chromium
        working-directory: electron
      - run: npx playwright test
        working-directory: electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: electron/e2e/.results
          if-no-files-found: ignore

  e2e-linux:
    name: e2e (real desktop app, Linux — advisory)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true # ADR 0007 amendment: build-only until this is green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run build:all
        working-directory: electron
      - run: npx playwright install --with-deps chromium
        working-directory: electron
      - run: xvfb-run -a npx playwright test e2e/smoke.spec.ts e2e/files.spec.ts e2e/settings.spec.ts e2e/paths.unit.spec.ts
        working-directory: electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-linux
          path: electron/e2e/.results
          if-no-files-found: ignore
