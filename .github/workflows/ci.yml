name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (app + landing page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Typecheck, lint and build the crux.garden public website — today a
      # landing page, in time Explore and the public crux and garden pages.
      # Nothing else: no Electron deps, no embedded apps, no Python. Seconds,
      # so website work never waits on a toolchain it did not touch.
      # Everything heavier lives in embedded-apps.yml and runs on demand.
      - run: npm run verify:core
