# Routine pushes verify the host, bundled tools and public website.
# Full optional-tool builds and desktop journeys live in desktop-full.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, codex/api-app-unification]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (web + electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      # Electron's deps come first: the web verify typechecks
      # electron/performance and electron/playwright.performance.config.ts,
      # which import @playwright/test from electron/node_modules.
      - run: npm ci
        working-directory: electron
      - run: npm ci
      - run: npm run verify # tsc + eslint + vitest + vite build — the same gate the agent runs
      - run: npm run verify
        working-directory: electron
      - name: Verify actual Compose parsing (no containers started)
        run: CRUX_COMPOSE_TEST=1 npx playwright test e2e/compose-config.spec.ts --project=desktop
        working-directory: electron
      - name: Verify Compose lifecycle against the local engine
        run: CRUX_COMPOSE_LIFECYCLE_TEST=1 npx playwright test e2e/compose-lifecycle.spec.ts --project=desktop
        working-directory: electron
      - run: npx playwright install --with-deps chromium
        working-directory: electron
      - run: npm run test:browser
        working-directory: electron
      - name: Verify the production public site and landing-page contract
        run: npx playwright test -c playwright.web.config.ts
        working-directory: electron
