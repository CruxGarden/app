<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/JetBrainsMono-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Crux Garden — where ideas grow. A creative platform that captures the evolution of ideas, solo or by collaborating with other people and AI agents." />
    <title>Crux Garden</title>
    <style>
      /* #0a0a0c matches the default dark palette --bg (obsidian preset).
         Hardcoded here because CSS custom properties aren't available before globals.css loads.
         If the default --bg changes, update this value to match. */
      body { margin: 0; background: #0a0a0c; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }
      #splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      /* JetBrains Mono is the display/mono font. Defined as @font-face in src/styles/globals.css,
         preloaded via <link rel="preload"> above. Fallback to monospace if not yet loaded. */
      #splash-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      #splash-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-inner">
        <span id="splash-title">Crux Garden</span>
        <div id="splash-spinner"></div>
      </div>
    </div>
    <script>
      /*
       * Splash screen color matching.
       *
       * This script runs synchronously before React loads. Its job is to
       * color the splash screen to match the user's active mood preset,
       * so the loading screen feels like part of the app — not a jarring
       * flash of wrong colors.
       *
       * It only runs on app routes (/home, /c/, /settings) because those
       * are the pages that need SQLite init time. Landing, login, and
       * public pages skip the splash entirely.
       *
       * The mood preset colors are duplicated here from lib/moods/presets.ts
       * because this script runs before any app code loads. If a preset
       * is added or its colors change, both places need updating.
       *
       * Each preset is [background, accent, text]. These map to:
       *   - background → splash + body background
       *   - accent     → spinner border color
       *   - text       → "Crux Garden" title color
       */
      (function () {
        var path = location.pathname;

        // Only show splash on app routes — these need SQLite init time.
        // Landing, login, and public pages render immediately with no splash.
        var isAppRoute = (
          path.startsWith('/home') ||
          path.startsWith('/c/') ||
          path.startsWith('/settings')
        );
        if (!isAppRoute) return;

        // 10 mood presets: [background, accent, text].
        // Source of truth: lib/moods/presets.ts — keep in sync.
        var presets = {
          // Dark presets
          cafe:     ['#1a1410', '#d8a860', '#e0d0b8'],
          ember:    ['#181010', '#b87068', '#d8ccc8'],
          moss:     ['#141610', '#88a878', '#d0d8c8'],
          slate:    ['#141618', '#7098b8', '#c8d0d8'],
          obsidian: ['#0a0a0c', '#a0a0a8', '#d4d4d8'],
          // Light presets
          parchment:['#f4ece0', '#886838', '#2c2010'],
          rose:     ['#f6eeee', '#a06070', '#2c1818'],
          sage:     ['#eff4ec', '#507848', '#1c2418'],
          mist:     ['#eef2f6', '#486888', '#181c24'],
          ivory:    ['#f8f4ee', '#606050', '#303028']
        };

        // Read the user's theme mode (dark or light) from localStorage.
        var isLight = localStorage.getItem('cruxgarden:theme') === 'light';

        // Read which mood preset is active for the current mode.
        // Falls back to 'cafe' (dark) or 'parchment' (light) if not set.
        var presetKey = isLight ? 'cruxgarden:moodPresetLight' : 'cruxgarden:moodPresetDark';
        var presetId = localStorage.getItem(presetKey) || (isLight ? 'ivory' : 'obsidian');

        // Look up the colors. Fall back to garden if the preset ID is unknown.
        var colors = presets[presetId] || presets.cafe;

        // Apply the colors to the splash elements.
        var splash = document.getElementById('splash');
        var title = document.getElementById('splash-title');
        var spinner = document.getElementById('splash-spinner');

        splash.style.background = colors[0];
        document.body.style.background = colors[0];
        title.style.color = colors[2];
        spinner.style.borderColor = colors[1];
        spinner.style.borderTopColor = 'transparent'; // one transparent side = spinning effect

        // Show the splash. It stays visible until AppShell dismisses it
        // after SQLite and services finish initializing.
        splash.style.display = 'flex';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
