<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crux Garden mark, in plasma</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #050b12;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;
/** Mood colours: deep base, mid, accent - the teaser's green field. */
uniform vec3 uA, uB, uC;
/** Material, matched to the landing panel: tint, its strength, frost, rim. */
uniform vec3 uTint;
uniform float uOpacity, uFrost, uRim, uRimWidth, uSpec, uHair, uElev, uRefract, uDisp;
out vec4 o;

/* ── noise, as in the library's field ─────────────────────────────────── */
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
vec3 pal(float t){ return .5 + .5*cos(6.2831*(t + vec3(0., .33, .67))); }

/** The field behind the mark. Procedural, so frost can supersample it rather
    than needing a blur chain. */
vec3 field(vec2 p){
  vec2 q = p/520.;
  float t = uTime*.035;
  vec2 w = vec2(fbm(q+t), fbm(q+vec2(5.2,1.3)-t));
  float n = fbm(q*1.4 + w*1.8 + t*.6);
  vec3 col = mix(uA, uB, smoothstep(.25,.75,n));
  col = mix(col, uC, smoothstep(.55,.9, w.x*n*1.6));
  float lines = abs(fract(n*14.)-.5);
  col += (1.-smoothstep(0.,.06,lines)) * .07;
  vec2 v = p/uRes - .5;
  col *= .55 + .45*smoothstep(1.2,.2,length(v));
  return col;
}

/** Frosted background: the field averaged over a disc, widening with frost. */
vec3 seen(vec2 p, float f){
  if (f < .004) return field(p);
  float r = 3. + 34.*f;
  vec3 s = field(p);
  for (int i = 0; i < 10; i++){
    float a = float(i) * 2.399963;          // golden angle, so the taps spiral
    float d = r * sqrt((float(i)+.5)/10.);
    s += field(p + vec2(cos(a), sin(a))*d);
  }
  return s / 11.;
}

/* ── the mark ─────────────────────────────────────────────────────────── */
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x,q.y),0.) + length(max(q,0.)) - r;
}
/** Ring and cross, exactly the favicon's proportions: r=10 and an 8-long bar
    on a 24 box, with the stroke width carried over as the solid thickness. */
float mark(vec2 p, float s){
  float ring = abs(length(p) - 10.*s) - .75*s;   // stroke-width 1.5 => half is .75
  float barH = sdRoundBox(p, vec2(4.0*s, 0.75*s), .75*s);
  float barV = sdRoundBox(p, vec2(0.75*s, 4.0*s), .75*s);
  return min(ring, min(barH, barV));
}

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float s = min(uRes.x, uRes.y) / 26.;                 // the 24 box, with the icon's margin
  vec2 p = frag - uRes*.5;

  float d = mark(p, s);
  vec3 back = field(frag);

  // Shadow: the mark floats, so it casts down and slightly out.
  float sh = mark(p - vec2(0., 10.*uElev), s);
  vec3 col = back * (1. - .55*uElev*smoothstep(26., -2., sh));

  if (d < 6.){
    // Normal from the distance field, and how near the edge we are.
    vec2 e = vec2(1.2, 0.);
    vec2 g = vec2(mark(p+e.xy,s)-mark(p-e.xy,s), mark(p+e.yx,s)-mark(p-e.yx,s));
    vec2 n = g / (length(g) + 1e-4);
    float inside = clamp(-d / (.75*s), 0., 1.);        // 0 at the edge, 1 at the core
    float bevel = 1. - smoothstep(0., .55, inside);
    float lift = sqrt(max(1. - bevel*bevel, 0.));

    // Refraction: the edge bends what is behind it, split by dispersion.
    vec2 off = -n * pow(bevel, 2.2) * 46. * uRefract;
    float disp = .16 * uDisp;
    vec3 refr = vec3(
      seen(frag + off*(1.+disp), uFrost).r,
      seen(frag + off, uFrost).g,
      seen(frag + off*(1.-disp), uFrost).b
    );
    refr = mix(refr, vec3(dot(refr, vec3(.333))), .18) * 1.08 + .03;
    refr = mix(refr, uTint, uOpacity);

    // Iridescent rim, a pointer-less light from above-left.
    vec2 L = normalize(vec2(-.45, -.9));
    float slope = clamp(length(g)/.9, 0., 1.);
    float fres = pow(bevel, 5./max(uRimWidth,.05));
    vec3 rimCol = pal(dot(n,L)*.35 + (1.-bevel)*.8 + uTime*.04);
    float spec = pow(max(dot(n,L),0.), 26.) * pow(bevel, 2.);

    vec3 plasma = refr;
    plasma += rimCol * fres * .55 * uRim;
    plasma += vec3(1.) * spec * .75 * uSpec;
    plasma += pal(uTime*.04 + p.y/900.) * .05 * lift;
    plasma += vec3(.9,.95,1.) * (1.-smoothstep(0., 2.2, abs(d + 1.))) * .4 * uHair;

    col = mix(col, plasma, smoothstep(1.2, -1.2, d));
  }

  col += (hash(frag + uTime) - .5) * .02;
  o = vec4(col, 1.);
}
    </script>
    <script>
      const canvas = document.getElementById('c');
      const gl = canvas.getContext('webgl2', { antialias: false });
      const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`;
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      const u = (n) => gl.getUniformLocation(prog, n);
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);

      // The landing page's material and field, so the mark is the same stuff
      // the panels are made of.
      const SETTINGS = {
        colors: ['#050b12', '#0f5e46', '#3fbf8f'],
        tint: '#061016',
        opacity: 0.55,
        frost: 0.5,
        rim: 1.3,
        rimWidth: 1.4,
        highlight: 1,
        edgeLine: 1,
        elevation: 0.5,
        refraction: 1.4,
        dispersion: 2.2,
      };
      window.PLASMA_ICON = SETTINGS;

      // ?size=1024 renders one square frame at that many pixels and stops, so
      // an export is the same image every time. ?t= picks the moment.
      const params = new URLSearchParams(location.search);
      const size = Number(params.get('size')) || 0;
      const frozen = params.has('t') ? Number(params.get('t')) : size ? 8 : null;

      const resize = () => {
        if (size) {
          canvas.width = canvas.height = size;
          canvas.style.width = canvas.style.height = size + 'px';
        } else {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(innerWidth * dpr);
          canvas.height = Math.round(innerHeight * dpr);
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
      };
      addEventListener('resize', resize);
      resize();

      /** Save what is on screen, at whatever size it is currently drawn. */
      window.savePng = (name = `crux-plasma-${canvas.width}.png`) =>
        new Promise((done) =>
          canvas.toBlob((b) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
            done(name);
          }),
        );
      addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') window.savePng();
      });

      const start = performance.now();
      const frame = () => {
        gl.uniform2f(u('uRes'), canvas.width, canvas.height);
        gl.uniform1f(u('uTime'), frozen !== null ? frozen : (performance.now() - start) / 1000);
        gl.uniform3fv(u('uA'), hex(SETTINGS.colors[0]));
        gl.uniform3fv(u('uB'), hex(SETTINGS.colors[1]));
        gl.uniform3fv(u('uC'), hex(SETTINGS.colors[2]));
        gl.uniform3fv(u('uTint'), hex(SETTINGS.tint));
        gl.uniform1f(u('uOpacity'), SETTINGS.opacity);
        gl.uniform1f(u('uFrost'), SETTINGS.frost);
        gl.uniform1f(u('uRim'), SETTINGS.rim);
        gl.uniform1f(u('uRimWidth'), SETTINGS.rimWidth);
        gl.uniform1f(u('uSpec'), SETTINGS.highlight);
        gl.uniform1f(u('uHair'), SETTINGS.edgeLine);
        gl.uniform1f(u('uElev'), SETTINGS.elevation);
        gl.uniform1f(u('uRefract'), SETTINGS.refraction);
        gl.uniform1f(u('uDisp'), SETTINGS.dispersion);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (frozen === null) requestAnimationFrame(frame);
        else window.__ready = true;
      };
      frame();
    </script>
  </body>
</html>
